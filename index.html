<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krugkatalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --steinzeug:#EDEAE2; --steinzeug-tief:#DDD8CB;
    --kobalt:#2B4A8B; --kobalt-dunkel:#1D3260;
    --zinn:#8E8E94; --tinte:#26241F; --bernstein:#B07B2E; --karte:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--steinzeug);color:var(--tinte);font-family:"Source Sans 3",sans-serif;line-height:1.5}
  header{background:var(--kobalt);color:#F2F0E9;padding:56px 24px 48px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% -20%,rgba(255,255,255,.14),transparent 55%);pointer-events:none}
  .kopf-innen{max-width:1080px;margin:0 auto}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;margin-bottom:14px}
  h1{font-family:"Fraunces",serif;font-weight:700;font-size:clamp(34px,5.5vw,58px);line-height:1.04;letter-spacing:-.01em}
  h1 .duenn{font-weight:500;opacity:.85}
  .stats{display:flex;gap:36px;margin-top:30px;flex-wrap:wrap}
  .stat b{font-family:"Fraunces",serif;font-size:26px;font-weight:700;display:block}
  .stat span{font-size:13px;opacity:.75}
  .filter{max-width:1080px;margin:0 auto;padding:22px 24px 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{border:1.5px solid var(--kobalt);color:var(--kobalt);background:transparent;border-radius:999px;padding:6px 16px;font:600 13.5px "Source Sans 3",sans-serif;cursor:pointer;transition:background .15s,color .15s}
  .chip:hover{background:rgba(43,74,139,.1)}
  .chip.aktiv{background:var(--kobalt);color:#fff}
  .chip:focus-visible{outline:3px solid var(--bernstein);outline-offset:2px}
  .sortleiste{max-width:1080px;margin:0 auto;padding:2px 24px 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px}
  .sortleiste label{font-weight:600;color:var(--tinte)}
  .sortleiste select{border:1.5px solid var(--kobalt);color:var(--kobalt);background:#fff;border-radius:999px;padding:6px 14px;font:600 13.5px "Source Sans 3",sans-serif;cursor:pointer}
  .sortleiste select:focus-visible{outline:3px solid var(--bernstein);outline-offset:2px}
  #sortRichtung:disabled{opacity:.4;cursor:default}
  #sortRichtung:disabled:hover{background:transparent}
  .raster{max-width:1080px;margin:0 auto;padding:20px 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
  .karte{background:var(--karte);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(38,36,31,.12);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
  .karte:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(38,36,31,.16)}
  .bildbox{position:relative;aspect-ratio:3/4;background:var(--steinzeug-tief);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .bildbox img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .platzhalter{font-family:"Fraunces",serif;font-size:56px;color:var(--zinn);opacity:.55}
  .nummernkarte{position:absolute;left:12px;top:12px;background:#fff;border-radius:3px;padding:4px 11px 6px;box-shadow:0 2px 5px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.05);transform:rotate(-2.5deg);font-family:"Fraunces",serif;font-weight:700;font-size:21px;color:#1a1a1a}
  .karten-text{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .titel{font:600 15.5px/1.3 "Source Sans 3",sans-serif}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .kategorie{font:600 11px "Source Sans 3",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--kobalt);background:rgba(43,74,139,.1);border-radius:4px;padding:3px 8px}
  .preis{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:14.5px;color:var(--bernstein)}
  .notiz{font-size:13px;color:#5c584f}
  .highlight-band{background:var(--bernstein);color:#fff;font:600 10.5px "Source Sans 3",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;position:absolute;right:0;top:0;border-radius:0 0 0 8px}
  @media (prefers-reduced-motion:reduce){.karte,.chip{transition:none}.karte:hover{transform:none}}
  .lightbox{position:fixed;inset:0;background:rgba(20,18,14,.92);display:flex;align-items:center;justify-content:center;z-index:100;padding:min(60px,6vh) min(70px,6vw)}
  .lightbox[hidden]{display:none}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lb-nummer{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:#F2F0E9;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.08em;opacity:.8}
  .lb-btn{position:absolute;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.4);color:#F2F0E9;border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .lb-btn:hover{background:rgba(255,255,255,.22)}
  .lb-btn:focus-visible{outline:3px solid var(--bernstein);outline-offset:2px}
  #lb-close{top:18px;right:18px}
  #lb-prev{left:12px;top:50%;transform:translateY(-50%)}
  #lb-next{right:12px;top:50%;transform:translateY(-50%)}
  @media (max-width:640px){.lb-btn{width:38px;height:38px;font-size:17px}}
</style>
</head>
<body>

<header>
  <div class="kopf-innen">
    <h1>Bierkrug-Katalog</h1>
    <div class="stats">
      <div class="stat"><b id="st-anzahl">–</b><span>Krüge erfasst</span></div>
    </div>
  </div>
</header>

<div class="filter" id="filter" role="toolbar" aria-label="Nach Kategorie filtern"></div>
<main class="raster" id="raster"></main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Krug-Vollbildansicht">
  <span class="lb-nummer" id="lb-nummer"></span>
  <button class="lb-btn" id="lb-close" type="button" aria-label="Schließen">&times;</button>
  <button class="lb-btn" id="lb-prev" type="button" aria-label="Vorheriges Bild">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-btn" id="lb-next" type="button" aria-label="Nächstes Bild">&#8250;</button>
</div>

const raster=document.getElementById("raster");
const filter=document.getElementById("filter");
let aktiv="Alle";
const FILTER_KATEGORIEN=[
  {key:"Alle", label:"Alle"},
  {key:"Reservistenkrug", label:"Reservistenkrüge"},
  {key:"Oktoberfest", label:"Oktoberfest"},
  {key:"Zunftkrüge", label:"Zunftkrüge"},
  {key:"Glas", label:"Glaskrüge"},
  {key:"Kindl", label:"Münchner Kindl"}
];
function zeichneFilter(){
  filter.innerHTML=FILTER_KATEGORIEN.map(({key,label})=>`<button class="chip${key===aktiv?" aktiv":""}" data-k="${key}">${label}</button>`).join("");
}
let aktuelleListe=[];
function zeichneRaster(){
  aktuelleListe=KRUEGE.filter(k=>aktiv==="Alle"||(aktiv==="Kindl"?k.kindl:aktiv==="Glas"?(k.kat==="Glas"||k.glas):k.kat===aktiv));
  raster.innerHTML=aktuelleListe.map((k,i)=>`
    <article class="karte">
      <div class="bildbox">
        <img src="bilder/${k.img}" alt="Krug ${k.nr}: ${k.titel}" data-idx="${i}"
             onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<div class=platzhalter>\uD83C\uDF7A</div>')">
        <div class="nummernkarte">${k.nr}</div>
      </div>
      <div class="karten-text">
        <div class="titel">${k.titel}</div>
        <div class="meta"><span class="kategorie">${k.kat}</span>${k.jahr?`<span class="preis">${k.jahr}</span>`:""}</div>
      </div>
    </article>`).join("");
}
function zeichneStats(){
  document.getElementById("st-anzahl").textContent=KRUEGE.length+" / 450";
}
filter.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;aktiv=b.dataset.k;zeichneFilter();zeichneRaster();});

const lightbox=document.getElementById("lightbox");
const lbImg=document.getElementById("lb-img");
const lbNummer=document.getElementById("lb-nummer");
const lbPrev=document.getElementById("lb-prev");
const lbNext=document.getElementById("lb-next");
let lbIndex=-1;
function zeigeLightboxBild(){
  const k=aktuelleListe[lbIndex];
  lbImg.src="bilder/"+k.img;
  lbImg.alt="Krug "+k.nr+": "+k.titel;
  lbNummer.textContent="Krug "+k.nr+" / "+aktuelleListe.length;
  lbPrev.hidden=lbIndex<=0;
  lbNext.hidden=lbIndex>=aktuelleListe.length-1;
}
function oeffneLightbox(i){
  lbIndex=i;
  zeigeLightboxBild();
  lightbox.hidden=false;
}
function schliesseLightbox(){
  lightbox.hidden=true;
  lbImg.src="";
}
raster.addEventListener("click",e=>{
  const img=e.target.closest(".bildbox img");
  if(!img||img.dataset.idx===undefined)return;
  oeffneLightbox(Number(img.dataset.idx));
});
document.getElementById("lb-close").addEventListener("click",schliesseLightbox);
lbPrev.addEventListener("click",()=>{if(lbIndex>0){lbIndex--;zeigeLightboxBild();}});
lbNext.addEventListener("click",()=>{if(lbIndex<aktuelleListe.length-1){lbIndex++;zeigeLightboxBild();}});
lightbox.addEventListener("click",e=>{if(e.target===lightbox)schliesseLightbox();});
document.addEventListener("keydown",e=>{
  if(lightbox.hidden)return;
  if(e.key==="Escape")schliesseLightbox();
  else if(e.key==="ArrowLeft"&&lbIndex>0){lbIndex--;zeigeLightboxBild();}
  else if(e.key==="ArrowRight"&&lbIndex<aktuelleListe.length-1){lbIndex++;zeigeLightboxBild();}
});

zeichneFilter();zeichneRaster();zeichneStats();
</script>
</body>
